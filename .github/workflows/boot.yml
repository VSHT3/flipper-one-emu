name: boot

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils zstd btrfs-progs openssh-client
      - run: ./f1emu doctor
      - name: Boot the newest official build
        run: ./f1emu start --open none --no-audio --timeout 900
      - name: Use it
        run: |
          ./f1emu status
          ./f1emu ssh -- uname -a
          ./f1emu apps list
          ./f1emu press view
          sleep 2
          ./f1emu screenshot panel.png
          ./f1emu stop
      - name: Show the boot log on failure
        if: failure()
        run: ./f1emu log --lines 200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel
          path: panel.png
          if-no-files-found: ignore
